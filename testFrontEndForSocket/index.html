<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KashefChat - Login & Signup</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .container { display: flex; gap: 50px; justify-content: center; }
        .form-section { border: 1px solid #ccc; padding: 20px; border-radius: 5px; flex: 1; }
        input { display: block; margin-bottom: 10px; width: 100%; padding: 5px; }
        button { cursor: pointer; padding: 5px 10px; }
        .google-section { margin-top: 12px; }
    </style>
</head>
<body>

    <h1>Welcome to KashefChat</h1>
    
    <div class="container">
        <!-- ============================== -->
        <!-- LOGIN SECTION                  -->
        <!-- ============================== -->
        <!-- Connect this form to your /login authentication endpoint -->
        <div class="form-section" id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <!-- Username or Email Input -->
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>

                <!-- Password Input -->
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>

                <!-- Validates credentials and usually returns a JWT token -->
                <button type="submit">Login</button>
            </form>

              <div class="google-section">
                <p>Or</p>
                <button type="button" id="google-login-btn">Continue with Google</button>
              </div>
        </div>

        <!-- ============================== -->
        <!-- SIGNUP SECTION                 -->
        <!-- ============================== -->
        <!-- Connect this form to your /signup registration endpoint -->
        <div class="form-section" id="signup-section">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <!-- Username Input -->
                <label for="signup-username">Username:</label>
                <input type="text" id="signup-username" placeholder="Choose a username" required>

                <!-- Email Input -->
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" placeholder="Enter your email" required>

                <!-- Password Input -->
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" placeholder="Create a password" required>

                <label for="signup-ConfirmPassword">Confirm Password:</label>
                <input type="password" id="signup-ConfirmPassword" placeholder="Confirm password" required>
                <!-- Creates a new user in the database -->
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // SCRIPT SECTION
        // ==========================================
        import { KeyGenerationService } from "./Services/keyGenerationService.js";
        import { CONFIG } from "./config.js";

        const base64ToArrayBuffer = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
        const arrayBufferToBase64 = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)));

        async function decryptPrivateKeyFromBackup(keyBackup, password) {
            if (!keyBackup?.ciphertext || !keyBackup?.salt || !keyBackup?.iv) {
                throw new Error("Key backup data missing");
            }
            const salt = base64ToArrayBuffer(keyBackup.salt);
            const iv = base64ToArrayBuffer(keyBackup.iv);
            const ciphertext = base64ToArrayBuffer(keyBackup.ciphertext);

            const passwordKey = await window.crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            const derivedKey = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt,
                    iterations: 100000,
                    hash: "SHA-256",
                },
                passwordKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decryptedPrivateKey = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                derivedKey,
                ciphertext
            );
            return arrayBufferToBase64(decryptedPrivateKey);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            const Response = await fetch(`${CONFIG.API_BASE_URL}/auth/logIn`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                email,
                password
              })
            });

            const data = await Response.json();

            if (Response.status === 200) {
              try {
                const meResponse = await fetch(`${CONFIG.API_BASE_URL}/user/me`, {
                  method: "GET",
                  credentials: "include"
                });

                if (!meResponse.ok) {
                  throw new Error("Could not fetch user info after login.");
                }

                const meData = await meResponse.json();
                const user = meData.data.user;

                // Restore private key from KeyBackup if missing locally
                if (!localStorage.getItem("privateKey") && user.KeyBackup) {
                  try {
                    const restoredPrivateKey = await decryptPrivateKeyFromBackup(user.KeyBackup, password);
                    localStorage.setItem("privateKey", restoredPrivateKey);
                  } catch (restoreError) {
                    console.warn("Could not restore private key from backup:", restoreError);
                  }
                }

                console.log("Login submitted");
                window.location.href = 'friends.html';
              } catch (err) {
                console.error("Login succeeded but user data fetch failed:", err);
                window.location.href = 'friends.html';
              }
            } else {
              console.error(data.error?.message || "Login failed");
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById("signup-username").value;
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;
            const confirmPassword = document.getElementById("signup-ConfirmPassword").value;
            const keyGenerationResult = await KeyGenerationService(password);
            const Response = await fetch(`${CONFIG.API_BASE_URL}/auth/signUp`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                name: username,
                email: email,
                password: password,
                confirmPassword: confirmPassword,
                publicKey: keyGenerationResult.publicKey,
                encryptedPrivateKey: keyGenerationResult.encryptedPrivateKey
              })
            });
            const data = await Response.json();
            if (Response.status === 200) {
              localStorage.setItem("privateKey", keyGenerationResult.privateKey);
              console.log("Signup successful");
              window.location.href = 'friends.html';
            } else {
              console.error(data.error?.message || data.error || "Signup failed");
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', () => {
            window.location.href = CONFIG.GOOGLE_AUTH_URL;
        });
    </script>
</body>
</html>
